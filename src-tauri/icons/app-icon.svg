<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Fleuron app icon (v0.23 Gold/Amber Edition).

    Four transcript lines; the second one is lit in warm gold. That is the whole product in
    one image: a passage picked out of a wall of talk.

    Built to the macOS template — 824pt of artwork on a 1024pt canvas, squircle
    radius 184 — so it sits correctly next to system icons in the Dock.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="42%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>

    <!-- Specular sheen across the top third, the way light sits on glass. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)" />
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)" />
    <rect
      x="103.5"
      y="103.5"
      width="817"
      height="817"
      rx="180.5"
      fill="none"
      stroke="url(#rim)"
      stroke-width="7"
    />
  </g>

  <!-- Transcript lines. Staggered widths read as speech, not as a list. -->
  <g>
    <rect x="252" y="330" width="330" height="54" rx="27" fill="#ffffff" opacity="0.35" />

    <!-- The coded line: haloed in amber, full-bleed, unmistakably the subject. -->
    <rect
      x="252"
      y="446"
      width="520"
      height="54"
      rx="27"
      fill="#F59E0B"
      opacity="0.65"
      filter="url(#glow)"
    />
    <rect x="252" y="446" width="520" height="54" rx="27" fill="url(#lit)" />

    <rect x="252" y="562" width="418" height="54" rx="27" fill="#ffffff" opacity="0.35" />
    <rect x="252" y="678" width="228" height="54" rx="27" fill="#ffffff" opacity="0.20" />
  </g>
</svg>
