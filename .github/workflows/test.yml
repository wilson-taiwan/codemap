name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify version manifests match
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$TAURI" != "$PKG" || "$CARGO" != "$PKG" ]]; then
            echo "Version mismatch: package.json=$PKG, tauri.conf.json=$TAURI, Cargo.toml=$CARGO"
            exit 1
          fi

  verify-migrations-and-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/test.yml .github/workflows/test-e2e.yml .github/workflows/candidate.yml .github/workflows/release.yml].each { |f| YAML.load_file(f) }'
      # bash 5 on the runners rejects things macOS bash 3.2 accepts, and a
      # run block that only fires on a tag is not exercised until release day.
      - name: Workflow shell syntax (bash 5)
        run: bash scripts/verify-workflow-shell.sh
      - name: PowerShell source encoding (ASCII)
        run: bash scripts/verify-ps1-ascii.sh
      - name: Release-contract assertions (+ negative mutations)
        run: node --test scripts/release-contract.test.mjs
      - name: Static migration gate
        run: bash scripts/verify-supabase-migrations.sh
      - name: Migration verifier self-check (negative fixtures)
        run: bash scripts/verify-supabase-migrations.test.sh

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Frontend unit tests
        run: npm test
      - name: Frontend build
        run: npm run build

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      FLEURON_BUILD_COMMIT: ci-test-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install dependencies
        run: npm ci
      # Windows legs compile + run the DPAPI source and its real-API tests on
      # every push; both platforms get the full clippy gate.
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
