name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify version manifests match
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$TAURI" != "$PKG" || "$CARGO" != "$PKG" ]]; then
            echo "Version mismatch: package.json=$PKG, tauri.conf.json=$TAURI, Cargo.toml=$CARGO"
            exit 1
          fi

  verify-migrations-and-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/test.yml .github/workflows/test-e2e.yml .github/workflows/candidate.yml .github/workflows/release.yml].each { |f| YAML.load_file(f) }'
      - name: Release-contract assertions (+ negative mutations)
        run: node --test scripts/release-contract.test.mjs
      - name: Static migration gate
        run: bash scripts/verify-supabase-migrations.sh
      - name: Migration verifier self-check (negative fixtures)
        run: bash scripts/verify-supabase-migrations.test.sh

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Frontend unit tests
        run: npm test
      - name: Frontend build
        run: npm run build

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      CODEMAP_BUILD_COMMIT: ci-test-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install dependencies
        run: npm ci
      # Windows legs compile + run the DPAPI source and its real-API tests on
      # every push; both platforms get the full clippy gate.
      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # The lib test executable links WebView2Loader.dll (via tauri -> wry ->
      # webview2-com-sys). Tauri copies that DLL next to the PACKAGED app, but
      # nothing puts it next to target/debug/deps, so the harness resolves a
      # stale loader off PATH and dies at load with STATUS_ENTRYPOINT_NOT_FOUND
      # (0xc0000139) before a single test runs. Build first, place the matching
      # DLL beside the test binaries, then run.
      - name: Stage WebView2Loader beside the test binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          dll="$(find src-tauri/target/debug/build -path '*x64*' -name 'WebView2Loader.dll' | head -1)"
          if [ -z "$dll" ]; then
            echo "::error::WebView2Loader.dll not found under src-tauri/target/debug/build"
            exit 1
          fi
          echo "staging $dll"
          cp -f "$dll" src-tauri/target/debug/deps/
      - name: DIAGNOSTIC - find the unresolved import (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/debug/deps -Filter 'qualitative_coding_app_lib-*.exe' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "TEST EXE: $($exe.FullName)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'Hostx64.x64' } | Select-Object -First 1
          Write-Host "DUMPBIN: $($dumpbin.FullName)"

          $lines = & $dumpbin.FullName /imports $exe.FullName
          $current = $null
          $map = @{}
          foreach ($line in $lines) {
            if ($line -match '^\s{4}(\S+\.[Dd][Ll][Ll])\s*$') {
              $current = $Matches[1]; $map[$current] = New-Object System.Collections.Generic.List[string]; continue
            }
            if ($current -and $line -match '^\s+[0-9A-Fa-f]+\s+([A-Za-z_][A-Za-z0-9_@\?\$]*)\s*$') {
              $map[$current].Add($Matches[1])
            }
          }
          Write-Host "=== IMPORTED DLLS ($($map.Keys.Count)) ==="
          $map.Keys | Sort-Object | ForEach-Object { Write-Host ("  {0}  ({1} symbols)" -f $_, $map[$_].Count) }

          Write-Host "=== RESOLVING EACH IMPORT ==="
          $missing = 0
          foreach ($dll in ($map.Keys | Sort-Object)) {
            $path = (Get-Command $dll -ErrorAction SilentlyContinue).Source
            if (-not $path) { $path = Join-Path $env:SystemRoot "System32\$dll" }
            if (-not (Test-Path $path)) {
              $local = Join-Path $exe.DirectoryName $dll
              if (Test-Path $local) { $path = $local } else { Write-Host "  !! DLL NOT FOUND: $dll"; $missing++; continue }
            }
            $ex = & $dumpbin.FullName /exports $path
            $names = @{}
            foreach ($l in $ex) {
              if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([^\s=]+)') { $names[$Matches[1]] = $true }
              elseif ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+([^\s=]+)\s*$') { $names[$Matches[1]] = $true }
            }
            foreach ($sym in $map[$dll]) {
              if (-not $names.ContainsKey($sym)) { Write-Host "  !! MISSING ENTRYPOINT: $dll -> $sym"; $missing++ }
            }
          }
          Write-Host "=== TOTAL UNRESOLVED: $missing ==="

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
